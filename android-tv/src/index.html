<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Signage TV Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Merriweather:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', sans-serif;
    }

    /* TV Optimized Styles */
    #media-video,
    #media-image,
    #media-text-container {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    #media-video,
    #media-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0a0a0b;
    }

    #media-pdf {
      background: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100vw;
      max-height: 100vh;
      display: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f0d0b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(180, 140, 60, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(180, 140, 60, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    #media-text-container {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      perspective: 3000px;
    }

    /* ===== MONOLITH CENTER STAGE ===== */
    .monolith-stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stageEnter 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      overflow: hidden;
    }

    /* Spotlight beam behind text */
    .spotlight-beam {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse at center,
        rgba(212, 175, 55, 0.06) 0%,
        rgba(212, 175, 55, 0.02) 30%,
        transparent 70%);
      pointer-events: none;
      z-index: 1;
      animation: beamBreathe 6s ease-in-out infinite;
    }
    @keyframes beamBreathe {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Floating golden orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 600px; height: 600px;
      top: -15%; left: -10%;
      background: radial-gradient(circle, rgba(212,175,55,0.1), transparent 70%);
      animation: orbFloat1 25s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 500px; height: 500px;
      bottom: -15%; right: -10%;
      background: radial-gradient(circle, rgba(201,168,39,0.08), transparent 70%);
      animation: orbFloat2 30s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 400px; height: 400px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(180,140,30,0.05), transparent 70%);
      animation: orbFloat3 20s ease-in-out infinite alternate;
    }
    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(100px, 80px) scale(1.15); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-80px, -100px) scale(1.1); }
    }
    @keyframes orbFloat3 {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-40%, -60%) scale(1.2); }
    }

    /* Particle dust */
    .particle-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        radial-gradient(2px 2px at 80px 120px, rgba(212,175,55,0.35), transparent),
        radial-gradient(1.5px 1.5px at 300px 80px, rgba(212,175,55,0.25), transparent),
        radial-gradient(2px 2px at 600px 250px, rgba(212,175,55,0.3), transparent),
        radial-gradient(1.5px 1.5px at 900px 150px, rgba(212,175,55,0.35), transparent),
        radial-gradient(2px 2px at 1200px 300px, rgba(212,175,55,0.2), transparent),
        radial-gradient(1.5px 1.5px at 1500px 100px, rgba(212,175,55,0.3), transparent),
        radial-gradient(2px 2px at 1700px 280px, rgba(212,175,55,0.25), transparent);
      background-size: 1920px 400px;
      animation: particleDrift 50s linear infinite;
    }
    @keyframes particleDrift {
      from { background-position: 0 0; }
      to { background-position: 1920px 400px; }
    }

    /* Progress ring bar */
    .progress-ring {
      position: absolute;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 3px;
      background: rgba(212,175,55,0.08);
      border-radius: 2px;
      overflow: hidden;
      z-index: 10;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(212,175,55,0.3), rgba(255,215,0,0.8), rgba(212,175,55,0.3));
      border-radius: 2px;
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 10px rgba(212,175,55,0.4);
    }

    /* Text column */
    .text-column {
      position: relative;
      z-index: 2;
      width: 88%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      text-align: center;
    }

    /* Ghost sentences (prev/next context) */
    .ghost {
      font-family: 'Playfair Display', 'Noto Serif Bengali', serif;
      font-size: clamp(1.2rem, 1.6vw, 2rem);
      line-height: 1.5;
      max-width: 85%;
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ghost-prev {
      color: rgba(232, 220, 200, 0.18);
      transform: translateY(-8px) scale(0.92);
      filter: blur(1.5px);
    }
    .ghost-next {
      color: rgba(232, 220, 200, 0.12);
      transform: translateY(8px) scale(0.92);
      filter: blur(2px);
    }

    /* Active sentence - the star */
    .active-line {
      font-family: 'Playfair Display', 'Noto Serif Bengali', serif;
      font-size: clamp(2.2rem, 3.5vw, 4.5rem);
      line-height: 1.35;
      color: #ffd770;
      font-weight: 600;
      max-width: 95%;
      text-shadow:
        0 0 10px rgba(255, 215, 0, 0.35),
        0 0 30px rgba(255, 215, 0, 0.2),
        0 0 60px rgba(212, 175, 55, 0.1);
      animation: sentenceGlow 2.5s ease-in-out infinite;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes sentenceGlow {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(255, 215, 0, 0.35),
          0 0 30px rgba(255, 215, 0, 0.2),
          0 0 60px rgba(212, 175, 55, 0.1);
      }
      50% {
        text-shadow:
          0 0 20px rgba(255, 215, 0, 0.55),
          0 0 50px rgba(255, 215, 0, 0.35),
          0 0 100px rgba(212, 175, 55, 0.2);
      }
    }

    /* Transition states */
    .active-line.is-exiting {
      opacity: 0;
      transform: translateY(-30px) scale(0.9);
      filter: blur(8px);
    }
    .active-line.is-entering {
      opacity: 0;
      transform: translateY(30px) scale(1.05);
      filter: blur(6px);
    }

    @keyframes stageEnter {
      from {
        opacity: 0;
        transform: scale(0.96);
        filter: brightness(0.2);
      }
      to {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
      }
    }

    /* No Content State */
    #no-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e6e6e6;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: #0a0a0b;
      text-align: center;
      padding: 2rem;
    }

    #no-content .icon {
      font-size: clamp(3rem, 8vw, 6rem);
      margin-bottom: 1.5rem;
      opacity: 0.5;
    }

    #no-content .hint {
      font-size: clamp(0.875rem, 2vw, 1.25rem);
      color: #808080;
      margin-top: 1rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      max-width: 600px;
      line-height: 1.6;
    }

    /* Registration Modal - Glassmorphism */
    #registration {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 11, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #e6e6e6;
      font-family: 'Inter', sans-serif;
      z-index: 100;
      padding: 2rem;
    }

    #registration.visible {
      display: flex;
    }

    #registration .card {
      background: rgba(27, 27, 29, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.5rem;
      padding: clamp(2rem, 5vw, 4rem);
      max-width: 600px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
    }

    #registration .logo {
      width: clamp(60px, 10vw, 80px);
      height: clamp(60px, 10vw, 80px);
      background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
    }

    #registration .logo span {
      font-size: clamp(2rem, 4vw, 2.5rem);
      color: white;
    }

    #registration h1 {
      margin-bottom: 0.5rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-align: center;
    }

    #registration .instructions {
      color: #808080;
      font-size: clamp(0.875rem, 2vw, 1rem);
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.6;
    }

    #registration .input-group {
      margin-bottom: 1rem;
    }

    #registration input {
      font-size: clamp(1rem, 2vw, 1.125rem);
      padding: 1rem 1.25rem;
      width: 100%;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      background: rgba(42, 42, 44, 0.6);
      color: #e6e6e6;
      outline: none;
    }

    #registration input:focus {
      background: rgba(53, 52, 55, 0.8);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    #registration input::placeholder {
      color: #666;
    }

    #registration button {
      background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
      color: #ffffff;
      border: none;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 12px 24px rgba(139, 92, 246, 0.3);
      font-size: clamp(0.875rem, 2vw, 1rem);
      padding: 1rem 1.5rem;
      width: 100%;
      border-radius: 0.75rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      margin-top: 0.5rem;
    }

    #registration button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(139, 92, 246, 0.4);
    }

    #registration button:active {
      transform: translateY(0);
    }

    #registration .status {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.75rem;
      text-align: center;
      font-size: 0.875rem;
      display: none;
    }

    #registration .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    #registration .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    /* Status Bar - Glassmorphism */
    #status-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(27, 27, 29, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #e6e6e6;
      padding: 12px 20px;
      border-radius: 1rem;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      align-items: center;
      gap: 8px;
    }

    #status-bar.visible {
      display: flex;
    }

    #status-bar.connected {
      border-left: 3px solid #10b981;
    }

    #status-bar.disconnected {
      border-left: 3px solid #ef4444;
    }

    #status-bar .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    #status-bar.connected .indicator {
      background: #10b981;
    }

    #status-bar.disconnected .indicator {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Mute Indicator */
    #mute-indicator {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(27, 27, 29, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #e6e6e6;
      padding: 12px 20px;
      border-radius: 1rem;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      display: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    #mute-indicator.visible {
      display: flex;
    }

    #mute-indicator:hover {
      background: rgba(53, 52, 55, 0.8);
    }

    #mute-indicator .icon {
      font-size: 18px;
    }

    /* Schedule Info Overlay */
    #schedule-info {
      position: absolute;
      bottom: 40px;
      left: 40px;
      background: rgba(27, 27, 29, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #e6e6e6;
      padding: 16px 24px;
      border-radius: 1rem;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      z-index: 40;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 400px;
    }

    #schedule-info.visible {
      display: block;
    }

    #schedule-info .title {
      font-weight: 700;
      margin-bottom: 4px;
      color: #ffffff;
    }

    #schedule-info .meta {
      color: #808080;
      font-size: 12px;
    }

    /* Loading Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Premium Book Loader */
    .premium-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 2rem;
      animation: fadeIn 0.8s ease-out;
    }

    .loader-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: pulse-icon 2s infinite ease-in-out;
    }

    .premium-loader h3 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #e8dcc8;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .premium-loader p {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      color: rgba(232, 220, 200, 0.5);
      max-width: 400px;
      line-height: 1.5;
    }

    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- Pairing Screen -->
  <div id="registration" class="visible">
    <div class="card">
      <div class="logo">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">tv</span>
      </div>
      <h1 id="pair-title">Pair Device</h1>
      <p class="instructions" id="pair-instructions">
        Use this pairing code in the CMS to connect this TV.
      </p>
      <div class="input-group" id="pair-code-group" style="text-align: center;">
        <div id="pair-code" style="font-size: clamp(3rem, 8vw, 5rem); font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: 0.5rem; color: #8b5cf6; margin: 1rem 0;">------</div>
      </div>
      <div class="input-group" id="pair-name-group">
        <input 
          type="text" 
          id="pair-device-name"
          placeholder="Enter a name for this TV" 
          autocomplete="off"
        >
      </div>
      <div class="input-group" id="repair-code-group" style="display: none;">
        <input 
          type="text" 
          id="repair-code-input"
          placeholder="Enter repair code from CMS" 
          autocomplete="off"
          maxlength="6"
        >
      </div>
      <button id="pair-submit">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 18px; vertical-align: middle; margin-right: 8px;">link</span>
        Get Pairing Code
      </button>
      <div id="pair-status" class="status"></div>
      <div style="margin-top: 1rem; text-align: center;">
        <a href="#" id="pair-mode-toggle" style="color: #8b5cf6; font-size: 14px; text-decoration: none;">Re-pair existing device</a>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar">
    <span class="indicator"></span>
    <span id="status-text">Connecting...</span>
  </div>

  <!-- Mute Indicator -->
  <div id="mute-indicator" title="Click to unmute">
    <span class="material-symbols-outlined icon" style="font-variation-settings: 'FILL' 1;">volume_off</span>
    <span>Audio muted - Click to enable</span>
  </div>

  <!-- Schedule Info -->
  <div id="schedule-info">
    <div class="title" id="schedule-title">Loading...</div>
    <div class="meta" id="schedule-meta">Digital Signage System</div>
  </div>

  <!-- Media Elements -->
  <video id="media-video" playsinline webkit-playsinline preload="auto" disableRemotePlayback x-webkit-airplay="deny"></video>
  <img id="media-image" alt="signage content">
  <canvas id="media-pdf"></canvas>
  <div id="media-text-container">
    <div class="monolith-stage" id="book-ui">
      <!-- Animated golden orbs -->
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <!-- Floating particles -->
      <div class="particle-field"></div>

      <!-- Radial spotlight behind text -->
      <div class="spotlight-beam"></div>

      <!-- Reading progress ring -->
      <div class="progress-ring" id="progress-ring">
        <div class="progress-fill" id="reading-progress" style="width: 0%"></div>
      </div>

      <!-- Cinematic text column -->
      <div class="text-column" id="text-column">
        <div class="ghost ghost-prev" id="ghost-prev"></div>
        <div class="active-line" id="active-sentence"></div>
        <div class="ghost ghost-next" id="ghost-next"></div>
      </div>
    </div>
  </div>

  <!-- No Content State -->
  <div id="no-content">
    <span class="material-symbols-outlined icon" style="font-variation-settings: 'FILL' 1;">tv</span>
    <div>Waiting for Content</div>
    <div class="hint">Create a schedule in the CMS dashboard to start playback</div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="src/app.js"></script>
</body>

</html>
